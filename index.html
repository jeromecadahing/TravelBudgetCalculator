<head>

    <meta name="apple-mobile-web-app-title" content="WanderBudget">

    <script src="https://cdn.tailwindcss.com"></script>

    <script src="https://unpkg.com/lucide@latest"></script>

        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdfa',
                            100: '#ccfbf1',
                            500: '#14b8a6',
                            600: '#0d9488',
                            700: '#0f766e',
                            900: '#134e4a',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(229, 231, 235, 0.8);
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col font-sans">

    <!-- Header -->
    <header class="sticky top-0 z-50 glass-card border-b border-slate-200/80 bg-white/90">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="p-2 bg-brand-500 text-white rounded-xl shadow-md">
                    <i data-lucide="plane" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold bg-gradient-to-r from-brand-700 to-teal-600 bg-clip-text text-transparent">WanderBudget</h1>
                    <p class="text-xs text-slate-500 font-medium">Smart Travel Planner</p>
                </div>
            </div>

            <!-- Controls: Mode & Currency -->
            <div class="flex items-center gap-3">
                <!-- Mode Toggle Switch -->
                <div class="bg-slate-100 p-1 rounded-xl flex text-xs font-semibold">
                    <button id="btnModeSingle" onclick="setMode('single')" class="px-3 py-1.5 rounded-lg transition-all shadow-sm bg-white text-slate-800">
                        Single City
                    </button>
                    <button id="btnModeMulti" onclick="setMode('multi')" class="px-3 py-1.5 rounded-lg transition-all text-slate-500 hover:text-slate-800">
                        Multi-City
                    </button>
                </div>

                <!-- Currency Selector (Defaults to GBP) -->
                <div class="flex items-center gap-2 bg-slate-100 px-3 py-1.5 rounded-xl border border-slate-200">
                    <i data-lucide="coins" class="w-4 h-4 text-slate-500"></i>
                    <select id="currencySelect" onchange="updateCalculations()" class="bg-transparent text-sm font-semibold text-slate-700 outline-none cursor-pointer">
                        <option value="GBP" selected>GBP (£)</option>
                        <option value="USD">USD ($)</option>
                        <option value="EUR">EUR (€)</option>
                        <option value="JPY">JPY (¥)</option>
                        <option value="AUD">AUD (A$)</option>
                        <option value="CAD">CAD (C$)</option>
                        <option value="INR">INR (₹)</option>
                    </select>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">

        <!-- Top Controls Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <!-- Left Panel: Trip Controls & Cities -->
            <div class="lg:col-span-2 space-y-6">
                
                <!-- Single City Mode Inputs -->
                <div id="singleCityPanel" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200/80 space-y-6">
                    <div class="flex justify-between items-center pb-4 border-b border-slate-100">
                        <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                            <i data-lucide="map-pin" class="w-5 h-5 text-brand-500"></i>
                            Select Destination
                        </h2>
                        <span class="text-xs bg-brand-50 text-brand-700 font-semibold px-2.5 py-1 rounded-full">Simple Mode</span>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Destination City</label>
                            <select id="singleCitySelect" onchange="handleSingleCityChange()" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-sm font-medium focus:ring-2 focus:ring-brand-500 outline-none">
                                <option value="paris">Paris, France</option>
                                <option value="tokyo">Tokyo, Japan</option>
                                <option value="bali">Bali, Indonesia</option>
                                <option value="nyc">New York City, USA</option>
                                <option value="bangkok">Bangkok, Thailand</option>
                                <option value="rome">Rome, Italy</option>
                                <option value="london">London, UK</option>
                                <option value="sydney">Sydney, Australia</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Sub-Location / Neighborhood</label>
                            <input type="text" id="singleSubLocation" placeholder="e.g. Montmartre or Le Marais" oninput="updateCalculations()" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-sm font-medium focus:ring-2 focus:ring-brand-500 outline-none">
                        </div>
                    </div>

                    <!-- Duration & Travelers -->
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Duration</label>
                            <div class="flex gap-2">
                                <input type="number" id="singleDuration" value="7" min="1" oninput="updateCalculations()" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-sm font-semibold outline-none">
                                <select id="singleDurationUnit" onchange="updateCalculations()" class="bg-slate-50 border border-slate-200 rounded-xl px-2 py-2.5 text-xs font-semibold outline-none">
                                    <option value="days">Days</option>
                                    <option value="weeks">Weeks</option>
                                    <option value="months">Months</option>
                                </select>
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Travelers</label>
                            <input type="number" id="singleTravelers" value="2" min="1" oninput="updateCalculations()" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-sm font-semibold outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Travel Style</label>
                            <select id="singleStyle" onchange="updateCalculations()" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-sm font-medium outline-none">
                                <option value="budget">Budget (Hostels / Street Food)</option>
                                <option value="moderate" selected>Moderate (3★ / Bistros)</option>
                                <option value="luxury">Luxury (5★ / Fine Dining)</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Multi-City Mode Panel (Hidden by default) -->
                <div id="multiCityPanel" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200/80 space-y-6 hidden">
                    <div class="flex justify-between items-center pb-4 border-b border-slate-100">
                        <div>
                            <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                                <i data-lucide="route" class="w-5 h-5 text-brand-500"></i>
                                Multi-City Itinerary
                            </h2>
                            <p class="text-xs text-slate-500">Add multiple stops and custom durations for each location</p>
                        </div>
                        <button onclick="addMultiCityStop()" class="flex items-center gap-1.5 text-xs font-bold bg-brand-500 hover:bg-brand-600 text-white px-3 py-2 rounded-xl transition">
                            <i data-lucide="plus" class="w-4 h-4"></i> Add Destination
                        </button>
                    </div>

                    <div id="multiCityList" class="space-y-4">
                        <!-- Dynamic Stops Injected Here -->
                    </div>
                </div>

                <!-- Expense Fine-Tuning & Custom Adjustments -->
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200/80 space-y-6">
                    <div class="flex justify-between items-center pb-2 border-b border-slate-100">
                        <h3 class="text-base font-bold text-slate-800 flex items-center gap-2">
                            <i data-lucide="sliders" class="w-4 h-4 text-brand-500"></i>
                            Cost Estimates & Adjustments
                        </h3>
                        <button onclick="resetDefaults()" class="text-xs text-brand-600 font-semibold hover:underline">Reset to City Defaults</button>
                    </div>

                    <div class="grid grid-cols-1 sm:grid
